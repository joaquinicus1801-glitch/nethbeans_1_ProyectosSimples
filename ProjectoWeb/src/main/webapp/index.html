<!DOCTYPE html>
<html>
<head>
    <title>Venta de Entradas - Teatro</title>
    <meta charset="UTF-8">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
        }

        label {
            display: block;
            text-align: left;
            margin-top: 10px;
            font-weight: bold;
            color: #555;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 8px;
            border: 1px solid #ccc;
            transition: 0.3s;
        }

        input:focus, select:focus {
            border-color: #4facfe;
            outline: none;
            box-shadow: 0 0 5px rgba(79,172,254,0.5);
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #007BFF, #00c6ff);
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #0056b3, #0096c7);
        }

        .footer {
            margin-top: 15px;
            font-size: 12px;
            color: gray;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>🎭 Venta de Entradas</h2>

    <form action="CalculoServlet" method="post">

        <label>Perfil:</label>
        <select name="perfil">
            <option>Niño</option>
            <option>Adolescente</option>
            <option>Adulto</option>
            <option>Adulto Mayor</option>
        </select>

        <label>Cantidad:</label>
        <input type="number" name="cantidad" required min="1">

        <label>Día:</label>
        <select name="dia">
            <option value="semana">Lunes a Viernes</option>
            <option value="fin">Sábado, Domingo o Feriado</option>
        </select>

        <button type="submit">Calcular</button>

    </form>

    <div class="footer">
        Sistema de ventas - Teatro 🎟️
    </div>
</div>

</body>
</html>
